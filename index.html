<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; media-src * data: blob: https:; img-src * data: blob: https:; connect-src * data: blob: https:; frame-src * https: data:; child-src * https: data:;">
  <title>Grok Desktop</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <style>
    :root {
      --color-text: #000000;
      --color-bg-toolbar: #F9F8F6;
      --color-bg-tab: #F9F8F6;
      --color-bg-tab-active: #ffffff;
      --color-bg-content: #ffffff;
      --color-border: #dddddd;
      --color-hover: #dddddd;
      --color-aot-border: #cccccc;
      --color-aot-hover: #e6e6e6;
      --scrollbar-track: #f1f1f1;
      --scrollbar-thumb: #c1c1c1;
      --scrollbar-thumb-hover: #a8a8a8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-text: #e6e6e6;
        --color-bg-toolbar: #1e1f22;
        --color-bg-tab: #2b2d31;
        --color-bg-tab-active: #3b3e45;
        --color-bg-content: #2b2d31;
        --color-border: #444444;
        --color-hover: #444444;
        --color-aot-border: #555555;
        --color-aot-hover: #444444;
        --scrollbar-track: #2a2b2f;
        --scrollbar-thumb: #55595f;
        --scrollbar-thumb-hover: #666b73;
      }
    }

    /* Also support JS-driven theme toggling via a class */
    :root.dark {
      --color-text: #e6e6e6;
      --color-bg-toolbar: #1e1f22;
      --color-bg-tab: #2b2d31;
      --color-bg-tab-active: #3b3e45;
      --color-bg-content: #2b2d31;
      --color-border: #444444;
      --color-hover: #444444;
      --color-aot-border: #555555;
      --color-aot-hover: #444444;
      --scrollbar-track: #2a2b2f;
      --scrollbar-thumb: #55595f;
      --scrollbar-thumb-hover: #666b73;
    }

    /* Basic styling for the tabs */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: var(--color-text);
    }

    .tabs-container {
      width: 100%;
      height: 50px;
      background-color: var(--color-bg-toolbar);
      display: flex;
      overflow: hidden; /* keep controls visible; only tabs scroll */
      position: relative;
    }

    .tabs {
      display: flex;
      flex: 1 1 auto;
      min-width: 0;            /* allow flex child to shrink so it doesn't push controls */
      overflow-x: auto;        /* scroll just the tabs area */
      overflow-y: hidden;
    }

    .tabs-scroll {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: none;
      color: var(--color-text);
      font-size: 18px;
      width: 28px;
      height: 40px;
      cursor: pointer;
      align-self: center;
      display: none; /* hidden by default; shown only when needed */
    }
    .tabs-scroll:hover { background-color: var(--color-hover); }
    .tabs-scroll-left { margin-right: 2px; }
    .tabs-scroll-right { margin-left: 2px; }

    .tab {
      display: flex;
      align-items: center;
      border-right: 1px solid var(--color-border);
      min-width: 180px;
      max-width: 220px;
      padding: 0 10px;
      height: 40px;
      background-color: var(--color-bg-tab);
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .tab.active {
      background-color: var(--color-bg-tab-active);
    }

    .tab-title {
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      margin-right: 20px;
    }

    .tab-close {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      margin: 0;
      padding: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      color: var(--color-text);
    }

    .tab-close:hover {
      background-color: var(--color-hover);
    }

    .new-tab-button {
      background: none;
      border: none;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
      color: var(--color-text);
    }

    .new-tab-group {
      display: flex;
      align-items: center;
      align-self: center;
      gap: 2px;
      flex: 0 0 auto;
    }

    .new-tab-group .new-tab-menu-button {
      width: 28px;
      margin-left: 0;
    }

    .new-tab-menu-button svg {
      width: 12px;
      height: 12px;
    }

    .new-tab-button:hover {
      background-color: var(--color-hover);
    }

    .app-controls {
      display: flex;
      align-items: center;
      padding: 0 5px;
      flex: 0 0 auto;          /* reserve space; never shrink */
      white-space: nowrap;
    }

    .aot-button {
      background: none;
      border: 1px solid var(--color-aot-border);
      border-radius: 4px;
      margin-left: 5px;
      padding: 2px 6px;
      font-size: 12px;
      cursor: pointer;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--color-text);
    }

    .aot-button:hover {
      background-color: var(--color-aot-hover);
    }

    .aot-button.active {
      background-color: #4CAF50;
      color: white;
      border-color: #4CAF50;
    }

    .reload-button {
      background: none;
      border: 1px solid var(--color-aot-border);
      border-radius: 4px;
      margin-right: 5px;
      padding: 2px 6px;
      font-size: 16px;
      cursor: pointer;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--color-text);
    }

    .reload-button:hover {
      background-color: var(--color-aot-hover);
    }

    .reload-button.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .reload-icon {
      display: inline-block;
      transform-origin: center;
      pointer-events: none;
    }

    .reload-button.loading .reload-icon {
      animation: spin-reload 1s linear infinite;
    }

    @keyframes spin-reload {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .views-container {
      height: calc(100vh - 40px);
      width: 100%;
      position: relative;
      background-color: var(--color-bg-content);
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      background-color: var(--color-bg-content);
    }

    .view.active {
      display: block;
    }

    webview {
      width: 100%;
      height: 100%;
      border: none;
      background-color: var(--color-bg-content);
    }

    .usage-status-bar {
      display: none;
      min-height: 32px;
      background-color: var(--color-bg-toolbar);
      border-top: 1px solid var(--color-border);
      padding: 0 12px 8px 12px;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      font-size: 12px;
      color: var(--color-text);
      flex-shrink: 0;
      box-sizing: content-box;
    }

    .usage-status-bar.active {
      display: flex;
    }

    .usage-stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .usage-label {
      opacity: 0.7;
    }

    .usage-value {
      font-weight: 600;
    }

    .usage-value.warning {
      color: #f39c12;
    }

    .usage-value.critical {
      color: #e74c3c;
    }

    .usage-refill .usage-value {
      color: #3498db;
    }

    .usage-toggle {
      padding: 2px 6px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s ease;
      font-size: 14px;
      user-select: none;
      order: -1;
      margin-right: -8px;
    }

    .usage-stat.clickable {
      cursor: pointer;
      padding: 1px 6px;
      margin: 0 -6px;
      border-radius: 4px;
      transition: background-color 0.15s ease;
    }

    .usage-stat.clickable:hover {
      background-color: var(--color-hover, rgba(127, 127, 127, 0.18));
    }

    .usage-status-bar.usage-hidden .usage-stat {
      display: none !important;
    }

    .usage-toggle:hover {
      opacity: 1;
    }

    .usage-toggle.hidden .toggle-icon {
      opacity: 0.4;
    }

    .usage-stat.hidden-stat {
      display: none;
    }

    /* Adjust views container height when status bar is active */
    body.usage-bar-active .views-container {
      height: calc(100vh - 40px - 41px);
    }

    /* New-tab flyout (Windows Terminal style) */
    .gd-flyout {
      position: fixed;
      z-index: 10000;
      min-width: 320px;
      max-width: 420px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      padding: 4px;
      background: #2b2b2b;
      color: #f3f3f3;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      user-select: none;
    }
    .gd-row {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 32px;
      padding: 0 10px;
      border-radius: 4px;
      cursor: default;
    }
    .gd-row:hover { background: rgba(255, 255, 255, 0.07); }
    .gd-row.disabled { opacity: 0.45; }
    .gd-row.disabled:hover { background: none; }
    .gd-row-icon { width: 16px; height: 16px; flex: 0 0 16px; display: inline-flex; align-items: center; justify-content: center; }
    .gd-icon { width: 16px; height: 16px; }
    .gd-avatar { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; }
    .gd-row-label { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gd-row-label.bold { font-weight: 600; }
    .gd-row-shortcut { flex: 0 0 auto; color: #9d9d9d; font-size: 12px; padding-left: 16px; }
    .gd-row-actions { display: inline-flex; gap: 2px; }
    .gd-row-btn {
      display: none;
      width: 24px; height: 24px;
      align-items: center; justify-content: center;
      background: none; border: none; border-radius: 4px;
      color: #c8c8c8; cursor: pointer; padding: 0;
    }
    .gd-row-btn.on { display: inline-flex; color: #60cdff; }
    .gd-row:hover .gd-row-btn { display: inline-flex; }
    .gd-row-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .gd-sep { height: 1px; margin: 4px 2px; background: rgba(255, 255, 255, 0.08); }
    .gd-header { padding: 6px 10px 2px; font-size: 11px; color: #9d9d9d; }

    /* Embedded Build CLI terminal tabs */
    .terminal-host {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 6px 0 0 8px;
      background: #0c0c0c;
    }
  </style>
</head>
<body>
  <div class="tabs-container">
    <button class="tabs-scroll tabs-scroll-left" id="tabs-scroll-left" aria-hidden="true">&#x2039;</button>
    <div class="tabs" id="tabs"></div>
    <button class="tabs-scroll tabs-scroll-right" id="tabs-scroll-right" aria-hidden="true">&#x203A;</button>
    <div class="app-controls">
  <div id="update-indicator" style="margin-right:8px;font-size:12px;opacity:0.9;cursor:pointer;text-decoration:underline;display:none;"></div>
  <button class="reload-button" id="reload-button" title="Reload current tab"><span class="reload-icon">↻</span></button>
  <button class="aot-button" id="aot-button" title="Always on top">AOT</button>
  <button class="aot-button" id="update-btn" style="margin-left:8px;display:none;background:#ff3333;color:#fff;border-color:#cc0000;" title="Update available">↑</button>
  <button class="aot-button" id="usage-btn" style="margin-left:8px;" title="Toggle Usage Stats">s</button>
  <button class="aot-button" id="info-btn" style="margin-left:8px;" title="About">i</button>
    </div>
  </div>
  <div class="views-container" id="views"></div>
  <div class="usage-status-bar" id="usage-status-bar">
    <div class="usage-toggle" id="usage-eye" title="Hide usage">
      <span class="toggle-icon">👁</span>
    </div>
    <div class="usage-stat" id="usage-weekly-wrap">
      <span class="usage-label">Weekly:</span>
      <span class="usage-value" id="usage-weekly">—</span>
    </div>
    <div class="usage-stat clickable" id="usage-credits-wrap" style="display:none;" title="Click to add">
      <span class="usage-label">Credits:</span>
      <span class="usage-value" id="usage-credits"></span>
    </div>
    <div class="usage-stat clickable" id="usage-reset-wrap" style="display:none;" title="Click to switch between reset time and countdown">
      <span class="usage-label">Reset:</span>
      <span class="usage-value" id="usage-reset"></span>
    </div>
  </div>

  <script>
    // Inline icons for the new-tab flyout (16px, currentColor)
    const GD_ICONS = {
      chat: '<path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h7A1.5 1.5 0 0 1 13 4.5v5A1.5 1.5 0 0 1 11.5 11H7l-3 2.5V11h0a1 1 0 0 1-1-1z"/>',
      bot: '<rect x="3" y="5" width="10" height="8" rx="2"/><path d="M8 5V2.8M6 9h.01M10 9h.01"/>',
      app: '<rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><path d="M6 6.5h.01M10 6.5h.01M5.8 9.8c1.2 1 3.2 1 4.4 0"/>',
      folderPlus: '<path d="M2.5 4.5A1 1 0 0 1 3.5 3.5h3l1.5 1.5h4.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/><path d="M8 7.5v3M6.5 9h3"/>',
      folder: '<path d="M2.5 4.5A1 1 0 0 1 3.5 3.5h3l1.5 1.5h4.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/>',
      terminal: '<rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M4.5 6.5 6.5 8l-2 1.5M8 10h3"/>',
      pin: '<path d="M6 2.5h4l-.5 4 2 2H4.5l2-2zM8 8.5v5"/>',
      trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/>'
    };
    const gdIcon = (name) => `<svg class="gd-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${GD_ICONS[name] || ''}</svg>`;
    const gdEsc = (t) => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const gdBase = (p) => String(p).replace(/[\\/]+$/, '').split(/[\\/]/).pop() || p;

    // Windows Terminal style new-tab flyout: New Chat, Bots, Grok Bot app, Build CLI folders.
    // Numbered entries (bots, then pinned/recent folders) get Ctrl+Shift+1..9.
    const newTabFlyout = {
      el: null,
      anchor: null,

      buildActions(data) {
        const numbered = [];
        const openBuild = (folder) => this.openBuild(folder, data);
        (data.bots || []).forEach(b => numbered.push({ kind: 'bot', bot: b, run: () => tabManager.createTab(b.url) }));
        (data.pinned || []).forEach(f => numbered.push({ kind: 'folder', folder: f, pinned: true, run: () => openBuild(f) }));
        (data.recent || []).forEach(f => numbered.push({ kind: 'folder', folder: f, pinned: false, run: () => openBuild(f) }));
        // Bots 1-10: Ctrl+Shift+1..9,0 / Build folders 1-10: F1..F10
        numbered.filter(a => a.kind === 'bot').forEach((a, i) => { if (i < 10) a.shortcut = `Ctrl+Shift+${(i + 1) % 10}`; });
        numbered.filter(a => a.kind === 'folder').forEach((a, i) => { if (i < 10) a.shortcut = `F${i + 1}`; });
        return numbered;
      },

      async openBuild(folder, data) {
        await ipcRenderer.invoke('build-folders-update', { action: 'touch', folder });
        if (data && data.pty) tabManager.createTerminalTab(folder);
        else ipcRenderer.invoke('build-launch-external', folder);
      },

      async newBuild() {
        const data = await ipcRenderer.invoke('new-tab-menu-data', { fresh: false });
        if (!data.cli) return;
        const folder = await ipcRenderer.invoke('build-pick-folder');
        if (folder) this.openBuild(folder, data);
      },

      async runIndex(kind, n) {
        const data = await ipcRenderer.invoke('new-tab-menu-data', { fresh: false });
        const a = this.buildActions(data).filter(x => x.kind === kind)[n - 1];
        if (a && !(kind === 'folder' && (data.missing || []).includes(a.folder))) a.run();
      },

      toggle(anchor) {
        if (this.el) { this.close(); return; }
        this.open(anchor);
      },

      async open(anchor) {
        this.anchor = anchor;
        const el = document.createElement('div');
        el.className = 'gd-flyout';
        this.el = el;
        document.body.appendChild(el);
        this.position();
        // Render immediately from cache, then refresh the bot list from the page
        this.render(await ipcRenderer.invoke('new-tab-menu-data', { fresh: false }));
        ipcRenderer.invoke('new-tab-menu-data', { fresh: true }).then(d => { if (this.el === el) this.render(d); });

        this._out = (e) => { if (this.el && !this.el.contains(e.target) && !anchor.contains(e.target)) this.close(); };
        this._key = (e) => { if (e.key === 'Escape') this.close(); };
        this._blur = () => this.close();
        setTimeout(() => {
          document.addEventListener('mousedown', this._out, true);
          document.addEventListener('keydown', this._key, true);
          window.addEventListener('blur', this._blur);
        });
      },

      position() {
        const r = this.anchor.getBoundingClientRect();
        this.el.style.top = `${Math.round(r.bottom + 4)}px`;
        this.el.style.left = `${Math.round(Math.max(8, Math.min(r.left - 8, window.innerWidth - 360)))}px`;
      },

      close() {
        if (!this.el) return;
        this.el.remove();
        this.el = null;
        document.removeEventListener('mousedown', this._out, true);
        document.removeEventListener('keydown', this._key, true);
        window.removeEventListener('blur', this._blur);
      },

      render(data) {
        const el = this.el;
        if (!el) return;
        el.innerHTML = '';
        const actions = this.buildActions(data);
        const row = ({ icon, iconHtml, label, shortcut, onClick, disabled, extras, title, bold }) => {
          const r = document.createElement('div');
          r.className = 'gd-row' + (disabled ? ' disabled' : '');
          if (title) r.title = title;
          r.innerHTML = `<span class="gd-row-icon">${iconHtml || gdIcon(icon)}</span>` +
            `<span class="gd-row-label${bold ? ' bold' : ''}">${gdEsc(label)}</span>` +
            `<span class="gd-row-actions"></span>` +
            `<span class="gd-row-shortcut">${gdEsc(shortcut || '')}</span>`;
          const act = r.querySelector('.gd-row-actions');
          (extras || []).forEach(x => {
            const b = document.createElement('button');
            b.className = 'gd-row-btn' + (x.on ? ' on' : '');
            b.title = x.title;
            b.innerHTML = gdIcon(x.icon);
            b.addEventListener('click', (e) => { e.stopPropagation(); x.click(); });
            act.appendChild(b);
          });
          if (!disabled) r.addEventListener('click', () => { this.close(); onClick(); });
          el.appendChild(r);
        };
        const sep = () => { const s = document.createElement('div'); s.className = 'gd-sep'; el.appendChild(s); };
        const header = (t) => { const h = document.createElement('div'); h.className = 'gd-header'; h.textContent = t; el.appendChild(h); };

        row({ icon: 'chat', label: 'New Chat', shortcut: 'Ctrl+T', bold: true, onClick: () => tabManager.createTab('https://grok.com') });

        // Bots
        sep();
        header('Bots');
        const bots = actions.filter(a => a.kind === 'bot');
        if (!bots.length) row({ icon: 'bot', label: 'No bots found yet', disabled: true, title: 'Open grok.com in a tab so the sidebar can be read' });
        const setPinned = async (bot, pinned) => {
          const res = await ipcRenderer.invoke('bot-set-pinned', { url: bot.url, pinned });
          if (res && res.error) console.warn('Grok Desktop: bot pin failed:', res.error);
          this.render(await ipcRenderer.invoke('new-tab-menu-data', { fresh: false }));
        };
        bots.forEach(a => row({
          iconHtml: a.bot.avatar ? `<img class="gd-avatar" src="${gdEsc(a.bot.avatar)}" alt="">` : null,
          icon: 'bot', label: a.bot.name, shortcut: a.shortcut, title: a.bot.url, onClick: a.run,
          extras: [a.bot.pinned
            ? { icon: 'pin', on: true, title: 'Unpin (on grok.com)', click: () => setPinned(a.bot, false) }
            : { icon: 'pin', title: 'Pin (on grok.com)', click: () => setPinned(a.bot, true) }]
        }));
        if (data.botApp) row({ icon: 'app', label: 'Open Grok Bot', onClick: () => ipcRenderer.invoke('open-grok-bot') });

        // Build CLI
        sep();
        header(data.cli ? 'Build CLI' : 'Build CLI (grok not found)');
        if (data.cli) {
          const update = async (action, folder) => {
            await ipcRenderer.invoke('build-folders-update', { action, folder });
            this.render(await ipcRenderer.invoke('new-tab-menu-data', { fresh: false }));
          };
          row({ icon: 'folderPlus', label: 'New…', shortcut: 'Ctrl+Shift+N', onClick: () => this.newBuild() });
          actions.filter(a => a.kind === 'folder').forEach(a => {
            const missing = (data.missing || []).includes(a.folder);
            row({
              icon: a.pinned ? 'pin' : 'folder',
              label: gdBase(a.folder) + (missing ? ' (missing)' : ''),
              title: a.folder, shortcut: a.shortcut, disabled: missing, onClick: a.run,
              extras: [
                a.pinned
                  ? { icon: 'pin', on: true, title: 'Unpin', click: () => update('unpin', a.folder) }
                  : { icon: 'pin', title: 'Pin', click: () => update('pin', a.folder) },
                { icon: 'trash', title: 'Remove from list', click: () => update('remove', a.folder) }
              ]
            });
          });

    const { ipcRenderer } = require('electron');
    const https = require('https');
    const currentVersionPromise = ipcRenderer.invoke('get-app-version');

    function parseTagName(tag) {
      if (!tag) return null;
      // expect vMAJOR.MINOR.PATCH
      const m = tag.trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
      if (!m) return null;
      return { major: +m[1], minor: +m[2], patch: +m[3] };
    }

    function cmpSemver(a, b) {
      if (a.major !== b.major) return a.major - b.major;
      if (a.minor !== b.minor) return a.minor - b.minor;
      return a.patch - b.patch;
    }

    let latestReleaseUrl = null;

    async function checkForUpdate() {
      try {
        const currentVersionStr = await currentVersionPromise;
        const cur = parseTagName('v' + currentVersionStr);
        if (!cur) return;
        const data = await fetchLatestRelease();
        if (!data || !data.tag_name) return;
        const latest = parseTagName(data.tag_name);
        if (!latest) return;
        if (cmpSemver(latest, cur) > 0) {
          const el = document.getElementById('update-indicator');
          const btn = document.getElementById('update-btn');

          // Validate and set the release URL
          let releaseUrl = data.html_url;
          if (!releaseUrl) {
            releaseUrl = `https://github.com/AnRkey/Grok-Desktop/releases/tag/${data.tag_name}`;
          }

          // Validate that the URL is a legitimate GitHub release URL
          const githubReleasePattern = /^https:\/\/github\.com\/AnRkey\/Grok-Desktop\/releases\/tag\/[^/]+$/;
          if (githubReleasePattern.test(releaseUrl)) {
            latestReleaseUrl = releaseUrl;
            if (btn) {
              btn.style.display = 'inline-block';
              btn.title = `Version ${data.tag_name} available`;
            }
          }
        }
      } catch (_) {}
    }

    function fetchLatestRelease() {
      const url = 'https://api.github.com/repos/AnRkey/Grok-Desktop/releases/latest';
      const headers = { 'User-Agent': 'Grok-Desktop', 'Accept': 'application/vnd.github+json' };
      return new Promise((resolve, reject) => {
        const req = https.get(url, { headers }, (res) => {
          let body = '';
          res.on('data', (chunk) => body += chunk);
          res.on('end', () => {
            try {
              resolve(JSON.parse(body));
            } catch (e) {
              resolve(null);
            }
          });
        });
        req.on('error', reject);
        req.end();
      });
    }

          const url = targetUrl;
          const { isInAppUrl, isSafeExternalUrl } = require('./src/url-policy.js');
          // Explicitly treat auth/navigation endpoints as internal and navigate in same tab
          if (/^https?:\/\/grok\.com\/sign-in(\b|\/|\?|#)/i.test(url)
           || /^https?:\/\/grok\.com\/sign-out(\b|\/|\?|#)/i.test(url)
           || /^https?:\/\/accounts\.x\.ai\/sign-in(\b|\/|\?|#)/i.test(url)) {
            if (typeof webview.loadURL === 'function') {

          const isInternalUrl = isInAppUrl(url);

      // Embedded terminal tab running the Grok Build CLI (xterm.js + node-pty in main)
      async createTerminalTab(folder) {
        const { Terminal } = require('@xterm/xterm');
        const { FitAddon } = require('@xterm/addon-fit');
        const tabId = 'tab-' + Date.now();
        const tabElement = document.createElement('div');

        titleEl.textContent = gdBase(folder);
        titleEl.title = folder;
        const viewElement = document.createElement('div');
        viewElement.className = 'view';
        viewElement.id = 'view-' + tabId;
        const host = document.createElement('div');
        host.className = 'terminal-host';
        viewElement.appendChild(host);
        this.tabsContainer.appendChild(tabElement);
        this.viewsContainer.appendChild(viewElement);
        this.updateNewTabButtonPosition();
        tabElement.addEventListener('click', (e) => {
          if (!e.target.classList.contains('tab-close')) this.activateTab(tabId);
        });
        tabElement.querySelector('.tab-close').addEventListener('click', () => this.closeTab(tabId));

        const term = new Terminal({
          fontFamily: '"Cascadia Mono", "Cascadia Code", Consolas, monospace',
          fontSize: 13,
          cursorBlink: true,
          theme: { background: '#0c0c0c' }
        });
        const fit = new FitAddon();
        term.loadAddon(fit);
        term.open(host);
        const tab = { id: tabId, element: tabElement, view: viewElement, webview: null, term, fit, ptyId: null };
        this.tabs.push(tab);
        this.activateTab(tabId);
        await new Promise(r => requestAnimationFrame(r));
        try { fit.fit(); } catch (_) {}

        const res = await ipcRenderer.invoke('pty-spawn', { cwd: folder, cols: term.cols, rows: term.rows });
        if (!res || res.error) {
          term.write(`\r\nCould not start grok: ${(res && res.error) || 'unknown error'}\r\n`);
          return tabId;
        }
        tab.ptyId = res.id;
        term.onData(d => ipcRenderer.send('pty-write', res.id, d));
        term.onResize(({ cols, rows }) => ipcRenderer.send('pty-resize', res.id, cols, rows));
        const ro = new ResizeObserver(() => {
          if (viewElement.classList.contains('active')) { try { fit.fit(); } catch (_) {} }
        });
        ro.observe(host);
        tab.onClose = () => {
          ro.disconnect();
          if (tab.ptyId) ipcRenderer.send('pty-kill', tab.ptyId);
          tab.ptyId = null;
          term.dispose();
        };
        term.focus();
        return tabId;
      },

      activateNextTab() {
        if (!this.tabs.length) return;
        if (!this.activeTabId) {
          this.activateTab(this.tabs[0].id);
          return;
        }
        const currentIndex = this.tabs.findIndex(t => t.id === this.activeTabId);
        const nextIndex = (currentIndex + 1) % this.tabs.length;
        this.activateTab(this.tabs[nextIndex].id);
      },

      activatePrevTab() {
        if (!this.tabs.length) return;
        if (!this.activeTabId) {
          this.activateTab(this.tabs[0].id);
          return;
        }
        const currentIndex = this.tabs.findIndex(t => t.id === this.activeTabId);
        const prevIndex = (currentIndex - 1 + this.tabs.length) % this.tabs.length;
        this.activateTab(this.tabs[prevIndex].id);
      },

      reloadActiveTab() {
        const activeTab = this.tabs.find(tab => tab.id === this.activeTabId);

        const reloadButton = document.getElementById('reload-button');
        if (reloadButton) {

      setupScrollButtons() {
        this.leftBtn = document.getElementById('tabs-scroll-left');
        this.rightBtn = document.getElementById('tabs-scroll-right');
        this.scrollContainer = this.tabsContainer; // tabs container is the scroll target for x
        if (this.leftBtn && this.rightBtn) {
          this.leftBtn.addEventListener('click', () => this.scrollByAmount(-200));
          this.rightBtn.addEventListener('click', () => this.scrollByAmount(200));
          // Update on scroll and resize
          this.scrollContainer.addEventListener('scroll', () => this.updateScrollButtons(), { passive: true });
          window.addEventListener('resize', () => this.updateScrollButtons());

          // Add mouse wheel functionality when hovering over tabs
          this.scrollContainer.addEventListener('wheel', (e) => {
            // Only handle if we're over the tabs area (not scroll buttons)
            if (e.target.closest('.tabs-scroll')) return;

            // Check if Ctrl is pressed for tab switching
            if (e.ctrlKey) {
              // Ctrl + scroll = switch tabs
              e.preventDefault(); // Prevent any default behavior
              if (e.deltaY > 0) {
                // Scroll down = next tab
                this.activateNextTab();
              } else if (e.deltaY < 0) {
                // Scroll up = previous tab
                this.activatePrevTab();
              }
            } else {
              // Regular scroll = horizontal scrolling of tabs
              const deltaX = e.deltaY * 0.5; // Scale down for smoother scrolling
              this.scrollContainer.scrollBy({
                left: deltaX,
                behavior: 'auto' // Use 'auto' for immediate response to wheel
              });

              // Prevent default vertical scrolling when over tabs
              e.preventDefault();
            }
          }, { passive: false });

          // Initial
          this.updateScrollButtons();
        }
      },

      scrollByAmount(dx) {
        this.scrollContainer.scrollBy({ left: dx, behavior: 'smooth' });
      },

      updateScrollButtons() {
        if (!this.leftBtn || !this.rightBtn) return;
        const sc = this.scrollContainer;
        const canScrollLeft = sc.scrollLeft > 0;
        const canScrollRight = Math.ceil(sc.scrollLeft + sc.clientWidth) < sc.scrollWidth;
        this.leftBtn.style.display = canScrollLeft ? 'inline-flex' : 'none';
        this.rightBtn.style.display = canScrollRight ? 'inline-flex' : 'none';
      },
      
      activateTab(tabId) {
        // Deactivate current active tab
        if (this.activeTabId) {
          const activeTab = this.tabs.find(tab => tab.id === this.activeTabId);
          if (activeTab) {
            activeTab.element.classList.remove('active');
            activeTab.view.classList.remove('active');
          }
        }
        
        // Activate new tab
        const tab = this.tabs.find(tab => tab.id === tabId);
        if (tab) {
          tab.element.classList.add('active');
          tab.view.classList.add('active');
          this.activeTabId = tabId;
          if (tab.term) {
            requestAnimationFrame(() => { try { tab.fit.fit(); } catch (_) {} tab.term.focus(); });
          }
        }
      },
      
      closeTab(tabId) {
        const tabIndex = this.tabs.findIndex(tab => tab.id === tabId);
        
        if (tabIndex !== -1) {
          const tab = this.tabs[tabIndex];
          if (typeof tab.onClose === 'function') { try { tab.onClose(); } catch (_) {} }
          
          // Remove from DOM
          tab.element.remove();
          tab.view.remove();
          
          // Remove from tabs array
          this.tabs.splice(tabIndex, 1);
          
          // If this was the active tab, activate another one
          if (this.activeTabId === tabId) {
            if (this.tabs.length > 0) {
              // Activate the tab to the left, or the first tab if this was the leftmost
              const newActiveIndex = Math.max(0, tabIndex - 1);
              this.activateTab(this.tabs[newActiveIndex].id);
            } else {
              this.activeTabId = null;
            }
          }
          
          // If no tabs left, create a new one
          if (this.tabs.length === 0) {
            this.createTab('https://grok.com');
          } else {
            // Update the new tab button position
            this.updateNewTabButtonPosition();
          }
        }
      }

        if (!w || typeof w.usagePercent !== 'number') {
          el.textContent = '—';
          wrap.title = 'Weekly usage unavailable' + (w && w.error ? `: ${w.error}` : '');
          creditsWrap.style.display = 'none';
          this.resetEnd = null;
          this.renderReset();
          return;
        }

        const pct = Math.round(w.usagePercent * 10) / 10;
        el.textContent = `${pct}%`;
        if (pct >= 90) el.classList.add('critical'); else if (pct >= 70) el.classList.add('warning');

        // Tooltip: pace (average burn since reset vs. what is left per remaining day)
        const lines = [];
        const startMs = Date.parse(w.periodStart), endMs = Date.parse(w.periodEnd);
        if (!isNaN(startMs) && !isNaN(endMs) && endMs > startMs) {
          const DAY = 86400000, now = Date.now();
          const elapsed = Math.max(0.1, (now - startMs) / DAY);
          const left = Math.max(0.1, (endMs - now) / DAY);
          // 14.2% per day is the goal.
          const avg = w.usagePercent / elapsed;
          lines.push(`Avg since reset: ${avg.toFixed(1)}%/day`);
          lines.push(`Left per day: ${(Math.max(0, 100 - w.usagePercent) / left).toFixed(1)}%/day`);
          lines.push(`On pace for ${(avg * ((endMs - startMs) / DAY)).toFixed(1)}% by reset`);
          if ((w.products || []).length) lines.push('');
        }
        lines.push(...(w.products || []).map(p => `${p.product}: ${p.usagePercent}%`));
        wrap.title = lines.join('\n');

        // Credits (prepaid balance, cents)
        const usd = (c) => '$' + (c / 100).toFixed(2);
        if (typeof w.prepaidCents === 'number') {
          let text = usd(w.prepaidCents);
          if (typeof w.onDemandUsedCents === 'number' && typeof w.onDemandCapCents === 'number' && w.onDemandCapCents > 0) {
            text += ` (extra ${usd(w.onDemandUsedCents)}/${usd(w.onDemandCapCents)})`;
          }
          document.getElementById('usage-credits').textContent = text;
          creditsWrap.style.display = '';
        } else {
          creditsWrap.style.display = 'none';
        }

        this.resetEnd = w.periodEnd ? new Date(w.periodEnd) : null;
        this.renderReset();
      }
    };

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      tabManager.init();
      usageStats.init();
      // Click to open latest release page
      const indicator = document.getElementById('update-indicator');
      if (indicator) {
        indicator.addEventListener('click', () => {
          const url = latestReleaseUrl || 'https://github.com/AnRkey/Grok-Desktop/releases/latest';
          if (window.ipcRenderer) {
            window.ipcRenderer.invoke('open-external-url', url);
          } else if (typeof ipcRenderer !== 'undefined') {
            ipcRenderer.invoke('open-external-url', url);
          }
        });
      }
      const updateBtn = document.getElementById('update-btn');
      if (updateBtn) {
        updateBtn.addEventListener('click', () => {
          const url = latestReleaseUrl || 'https://github.com/AnRkey/Grok-Desktop/releases/latest';
          if (window.ipcRenderer) {
            window.ipcRenderer.invoke('open-external-url', url);
          } else if (typeof ipcRenderer !== 'undefined') {
            ipcRenderer.invoke('open-external-url', url);
          }
        });
      }
      const infoBtn = document.getElementById('info-btn');
      if (infoBtn) {
        infoBtn.addEventListener('click', () => {
          if (window.ipcRenderer) {
            window.ipcRenderer.invoke('show-app-info');
          } else if (typeof ipcRenderer !== 'undefined') {
            ipcRenderer.invoke('show-app-info');
          }
        });
      }
    });
  </script>
</body>
