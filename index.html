<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; media-src * data: blob: https:; img-src * data: blob: https:; connect-src * data: blob: https:; frame-src * https: data:; child-src * https: data:;">
  <title>Grok Desktop</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="src/flyout.css">
  <style>
    :root {
      --color-text: #000000;
      --color-bg-toolbar: #F9F8F6;
      --color-bg-tab: #F9F8F6;
      --color-bg-tab-active: #ffffff;
      --color-bg-content: #ffffff;
      --color-border: #dddddd;
      --color-hover: #dddddd;
      --color-aot-border: #cccccc;
      --color-aot-hover: #e6e6e6;
      --scrollbar-track: #f1f1f1;
      --scrollbar-thumb: #c1c1c1;
      --scrollbar-thumb-hover: #a8a8a8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-text: #e6e6e6;
        --color-bg-toolbar: #1e1f22;
        --color-bg-tab: #2b2d31;
        --color-bg-tab-active: #3b3e45;
        --color-bg-content: #2b2d31;
        --color-border: #444444;
        --color-hover: #444444;
        --color-aot-border: #555555;
        --color-aot-hover: #444444;
        --scrollbar-track: #2a2b2f;
        --scrollbar-thumb: #55595f;
        --scrollbar-thumb-hover: #666b73;
      }
    }

    /* Also support JS-driven theme toggling via a class */
    :root.dark {
      --color-text: #e6e6e6;
      --color-bg-toolbar: #1e1f22;
      --color-bg-tab: #2b2d31;
      --color-bg-tab-active: #3b3e45;
      --color-bg-content: #2b2d31;
      --color-border: #444444;
      --color-hover: #444444;
      --color-aot-border: #555555;
      --color-aot-hover: #444444;
      --scrollbar-track: #2a2b2f;
      --scrollbar-thumb: #55595f;
      --scrollbar-thumb-hover: #666b73;
    }

    /* Basic styling for the tabs */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: var(--color-text);
    }

    .tabs-container {
      width: 100%;
      height: 50px;
      background-color: var(--color-bg-toolbar);
      display: flex;
      overflow: hidden; /* keep controls visible; only tabs scroll */
      position: relative;
    }

    .tabs {
      display: flex;
      flex: 0 1 auto;          /* shrink to its tabs so + follows the last tab */
      min-width: 0;            /* allow flex child to shrink so it doesn't push controls */
      overflow-x: auto;        /* scroll just the tabs area */
      overflow-y: hidden;
    }

    .tabs-scroll {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: none;
      color: var(--color-text);
      font-size: 18px;
      width: 28px;
      height: 40px;
      cursor: pointer;
      align-self: center;
      display: none; /* hidden by default; shown only when needed */
    }
    .tabs-scroll { align-items: center; justify-content: center; flex: 0 0 28px; align-self: flex-start; }
    .tabs-scroll:hover:not(:disabled) { background-color: var(--color-hover); }
    .tabs-scroll:disabled { opacity: 0.3; cursor: default; }
    .tabs-scroll-left { margin-right: 2px; }
    .tabs-scroll-right { margin-left: 2px; }

    .tab {
      display: flex;
      align-items: center;
      border-right: 1px solid var(--color-border);
      min-width: 180px;
      max-width: 220px;
      padding: 0 10px;
      height: 40px;
      background-color: var(--color-bg-tab);
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .tab.active {
      background-color: var(--color-bg-tab-active);
    }

    .tab-title {
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      margin-right: 20px;
    }

    .tab-close {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      margin: 0;
      padding: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      color: var(--color-text);
    }

    .tab-close:hover {
      background-color: var(--color-hover);
    }

    .new-tab-button {
      background: none;
      border: none;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
      color: var(--color-text);
    }

    .new-tab-group {
      display: flex;
      align-items: center;
      align-self: flex-start;
      height: 40px;
      gap: 2px;
      flex: 0 0 auto;
    }

    .new-tab-group .new-tab-menu-button {
      width: 28px;
      margin-left: 0;
    }

    .new-tab-menu-button svg {
      width: 12px;
      height: 12px;
    }

    .new-tab-button:hover {
      background-color: var(--color-hover);
    }

    .app-controls {
      display: flex;
      align-items: center;
      padding: 0 5px;
      flex: 0 0 auto;          /* reserve space; never shrink */
      margin-left: auto;       /* spacer: + / dropdown stay next to the tabs */
      white-space: nowrap;
    }

    .aot-button {
      background: none;
      border: 1px solid var(--color-aot-border);
      border-radius: 4px;
      margin-left: 5px;
      padding: 2px 6px;
      font-size: 12px;
      cursor: pointer;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--color-text);
    }

    .aot-button:hover {
      background-color: var(--color-aot-hover);
    }

    .aot-button.active {
      background-color: #4CAF50;
      color: white;
      border-color: #4CAF50;
    }

    .reload-button {
      background: none;
      border: 1px solid var(--color-aot-border);
      border-radius: 4px;
      margin-right: 5px;
      padding: 2px 6px;
      font-size: 16px;
      cursor: pointer;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      color: var(--color-text);
    }

    .reload-button:hover {
      background-color: var(--color-aot-hover);
    }

    .reload-button.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .reload-icon {
      display: inline-block;
      transform-origin: center;
      pointer-events: none;
    }

    .reload-button.loading .reload-icon {
      animation: spin-reload 1s linear infinite;
    }

    @keyframes spin-reload {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .views-container {
      height: calc(100vh - 40px);
      width: 100%;
      position: relative;
      background-color: var(--color-bg-content);
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      background-color: var(--color-bg-content);
    }

    .view.active {
      display: block;
    }

    webview {
      width: 100%;
      height: 100%;
      border: none;
      background-color: var(--color-bg-content);
    }

    .usage-status-bar {
      display: none;
      min-height: 32px;
      background-color: var(--color-bg-toolbar);
      border-top: 1px solid var(--color-border);
      padding: 0 12px 8px 12px;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      font-size: 12px;
      color: var(--color-text);
      flex-shrink: 0;
      box-sizing: content-box;
    }

    .usage-status-bar.active {
      display: flex;
    }

    .usage-stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .usage-label {
      opacity: 0.7;
    }

    .usage-value {
      font-weight: 600;
    }

    .usage-value.warning {
      color: #f39c12;
    }

    .usage-value.critical {
      color: #e74c3c;
    }

    .usage-refill .usage-value {
      color: #3498db;
    }

    .usage-toggle {
      padding: 2px 6px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s ease;
      font-size: 14px;
      user-select: none;
      order: -1;
      margin-right: -8px;
    }

    .usage-stat.clickable {
      cursor: pointer;
      padding: 1px 6px;
      margin: 0 -6px;
      border-radius: 4px;
      transition: background-color 0.15s ease;
    }

    .usage-stat.clickable:hover {
      background-color: var(--color-hover, rgba(127, 127, 127, 0.18));
    }

    .usage-status-bar.usage-hidden .usage-stat {
      display: none !important;
    }

    .usage-toggle:hover {
      opacity: 1;
    }

    .usage-toggle.hidden .toggle-icon {
      opacity: 0.4;
    }

    .usage-stat.hidden-stat {
      display: none;
    }

    /* Adjust views container height when status bar is active */
    body.usage-bar-active .views-container {
      height: calc(100vh - 40px - 41px);
    }


    /* Embedded Build CLI terminal tabs */
    .terminal-host {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 6px 0 0 8px;
      background: #0c0c0c;
    }
  </style>
</head>
<body>
  <div class="tabs-container">
    <button class="tabs-scroll tabs-scroll-left" id="tabs-scroll-left" aria-hidden="true">&#x2039;</button>
    <div class="tabs" id="tabs"></div>
    <button class="tabs-scroll tabs-scroll-right" id="tabs-scroll-right" aria-hidden="true">&#x203A;</button>
    <div class="app-controls">
  <div id="update-indicator" style="margin-right:8px;font-size:12px;opacity:0.9;cursor:pointer;text-decoration:underline;display:none;"></div>
  <button class="reload-button" id="reload-button" title="Reload current tab"><span class="reload-icon">↻</span></button>
  <button class="aot-button" id="aot-button" title="Always on top">AOT</button>
  <button class="aot-button" id="update-btn" style="margin-left:8px;display:none;background:#ff3333;color:#fff;border-color:#cc0000;" title="Update available">↑</button>
  <button class="aot-button" id="usage-btn" style="margin-left:8px;" title="Toggle Usage Stats">s</button>
  <button class="aot-button" id="info-btn" style="margin-left:8px;" title="About">i</button>
    </div>
  </div>
  <div class="views-container" id="views"></div>
  <div class="usage-status-bar" id="usage-status-bar">
    <div class="usage-toggle" id="usage-eye" title="Hide usage">
      <span class="toggle-icon">👁</span>
    </div>
    <div class="usage-stat" id="usage-weekly-wrap">
      <span class="usage-label">Weekly:</span>
      <span class="usage-value" id="usage-weekly">—</span>
    </div>
    <div class="usage-stat clickable" id="usage-credits-wrap" style="display:none;" title="Click to add">
      <span class="usage-label">Credits:</span>
      <span class="usage-value" id="usage-credits"></span>
    </div>
    <div class="usage-stat clickable" id="usage-reset-wrap" style="display:none;" title="Click to switch between reset time and countdown">
      <span class="usage-label">Reset:</span>
      <span class="usage-value" id="usage-reset"></span>
    </div>
  </div>

  <script src="src/flyout.js"></script>
  <script>

    // Simple tab management
    const { ipcRenderer } = require('electron');
    const https = require('https');
    const currentVersionPromise = ipcRenderer.invoke('get-app-version');

    function parseTagName(tag) {
      if (!tag) return null;
      // expect vMAJOR.MINOR.PATCH
      const m = tag.trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
      if (!m) return null;
      return { major: +m[1], minor: +m[2], patch: +m[3] };
    }

    function cmpSemver(a, b) {
      if (a.major !== b.major) return a.major - b.major;
      if (a.minor !== b.minor) return a.minor - b.minor;
      return a.patch - b.patch;
    }

    let latestReleaseUrl = null;

    async function checkForUpdate() {
      try {
        const currentVersionStr = await currentVersionPromise;
        const cur = parseTagName('v' + currentVersionStr);
        if (!cur) return;
        const data = await fetchLatestRelease();
        if (!data || !data.tag_name) return;
        const latest = parseTagName(data.tag_name);
        if (!latest) return;
        if (cmpSemver(latest, cur) > 0) {
          const el = document.getElementById('update-indicator');
          const btn = document.getElementById('update-btn');

          // Validate and set the release URL
          let releaseUrl = data.html_url;
          if (!releaseUrl) {
            releaseUrl = `https://github.com/AnRkey/Grok-Desktop/releases/tag/${data.tag_name}`;
          }

          // Validate that the URL is a legitimate GitHub release URL
          const githubReleasePattern = /^https:\/\/github\.com\/AnRkey\/Grok-Desktop\/releases\/tag\/[^/]+$/;
          if (githubReleasePattern.test(releaseUrl)) {
            latestReleaseUrl = releaseUrl;
            if (btn) {
              btn.style.display = 'inline-block';
              btn.title = `Version ${data.tag_name} available`;
            }
          }
        }
      } catch (_) {}
    }

    function fetchLatestRelease() {
      const url = 'https://api.github.com/repos/AnRkey/Grok-Desktop/releases/latest';
      const headers = { 'User-Agent': 'Grok-Desktop', 'Accept': 'application/vnd.github+json' };
      return new Promise((resolve, reject) => {
        const req = https.get(url, { headers }, (res) => {
          let body = '';
          res.on('data', (chunk) => body += chunk);
          res.on('end', () => {
            try {
              resolve(JSON.parse(body));
            } catch (e) {
              resolve(null);
            }
          });
        });
        req.on('error', reject);
        req.end();
      });
    }

    // Apply theme on message from main
    ipcRenderer.on('system-theme-updated', (_event, theme) => {
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    });

    const tabManager = {
      tabs: [],
      activeTabId: null,
      tabsContainer: document.getElementById('tabs'),
      viewsContainer: document.getElementById('views'),
      newTabButton: null,
      
      init() {
        // Create the new tab button
        this.createNewTabButton();
        
        // Set up reload button
        const reloadButton = document.getElementById('reload-button');
        reloadButton.addEventListener('click', () => {
          const activeTab = this.tabs.find(tab => tab.id === this.activeTabId);
          if (activeTab && activeTab.webview) {
            // Add loading state
            reloadButton.classList.add('loading');

            // Remove loading state when page finishes loading
            const removeLoading = () => {
              reloadButton.classList.remove('loading');
              activeTab.webview.removeEventListener('did-stop-loading', removeLoading);
            };
            activeTab.webview.addEventListener('did-stop-loading', removeLoading);

            // Reload the webview (after listener is attached)
            activeTab.webview.reload();
          }
        });
        
        // Set up AOT button
        const aotButton = document.getElementById('aot-button');
        aotButton.addEventListener('click', () => {
          // Use IPC to communicate with the main process
          ipcRenderer.invoke('toggle-always-on-top').then((isAlwaysOnTop) => {
            if (isAlwaysOnTop) {
              aotButton.classList.add('active');
            } else {
              aotButton.classList.remove('active');
            }
          });
        });
        
        // Create initial tab
        this.createTab('https://grok.com');

        // After initial UI is ready, check for updates
        checkForUpdate();

        // Setup tab scroll buttons visibility and behavior
        this.setupScrollButtons();
      },
      
      createNewTabButton() {
        // Create the new tab button if it doesn't exist
        if (!this.newTabButton) {
          // "+" plus a Windows Terminal style dropdown (New Chat / Grok Bot / Build CLI)
          this.newTabButton = document.createElement('div');
          this.newTabButton.className = 'new-tab-group';
          const plus = document.createElement('button');
          plus.className = 'new-tab-button';
          plus.textContent = '+';
          plus.title = 'New chat (Ctrl+T)';
          plus.addEventListener('click', () => {
            this.createTab('https://grok.com');
          });
          const menuBtn = document.createElement('button');
          menuBtn.className = 'new-tab-button new-tab-menu-button';
          menuBtn.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          menuBtn.title = 'Bots, Grok Bot and Build CLI';
          menuBtn.addEventListener('click', async () => {
            // Prefer the popup window (can extend past the app window); fall back in-window
            if (newTabFlyout.el) { newTabFlyout.close(); return; }
            const r = menuBtn.getBoundingClientRect();
            let ok = false;
            try { ok = await ipcRenderer.invoke('flyout-open', { left: r.left, bottom: r.bottom }); } catch (_) {}
            if (!ok) newTabFlyout.toggle(menuBtn);
          });
          this.newTabButton.append(plus, menuBtn);
        }
        
        // Keep it outside the scrolling strip, right after the right arrow
        this.placeNewTabButton();
      },

      placeNewTabButton() {
        const right = document.getElementById('tabs-scroll-right');
        if (right && this.newTabButton.previousElementSibling !== right) right.after(this.newTabButton);
      },
      
      updateNewTabButtonPosition() {
        // Move the new tab button to the end of the tabs list
        if (this.newTabButton) this.placeNewTabButton();
        // Re-evaluate scroll buttons after tab changes
        this.updateScrollButtons();
      },
      
      createTab(url) {
        const tabId = 'tab-' + Date.now();
        
        // Create tab element
        const tabElement = document.createElement('div');
        tabElement.className = 'tab';
        tabElement.id = tabId;
        tabElement.innerHTML = `
          <div class="tab-title">New Tab</div>
          <button class="tab-close" title="Close tab (Ctrl+W, middle-click)">×</button>
        `;
        
        // Create view element with webview
        const viewElement = document.createElement('div');
        viewElement.className = 'view';
        viewElement.id = 'view-' + tabId;
        
        const webview = document.createElement('webview');
        webview.src = url;
        webview.partition = 'persist:grok';
        webview.setAttribute('allowpopups', '');
        webview.setAttribute('allow', 'microphone; camera; autoplay; clipboard-read; clipboard-write; display-capture');
        
        viewElement.appendChild(webview);

        const ensureWebviewBackground = () => {
          const bg = getComputedStyle(webview).backgroundColor;
          if (bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') {
            webview.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--color-bg-content').trim() || '#ffffff';
          }
        };
        ensureWebviewBackground();

        const applyAppleLightScheme = async () => {
          let currentUrl = '';
          try { currentUrl = webview.getURL ? webview.getURL() : ''; } catch (_) {}
          const target = (currentUrl || '').toLowerCase();
          const wcId = webview.getWebContentsId ? webview.getWebContentsId() : null;
          if (wcId && (target.includes('appleid.apple.com') || target.includes('appleid.apple.com/auth'))) {
            try { await ipcRenderer.invoke('force-light-color-scheme', wcId, true); } catch (_) {}
            // Fallback CSS to force light palette in case site ignores color scheme
            const lightCss = `:root{color-scheme:light !important}
              html,body{background:#ffffff !important;color:#000000 !important}
              input,textarea,select{background:#ffffff !important;color:#000000 !important;border-color:#bbb !important}
              header,nav{background:#ffffff !important;color:#000000 !important}
            `;
            try { webview.insertCSS(lightCss).catch(()=>{}); } catch (_) {}
            webview.style.backgroundColor = '#ffffff';
          } else if (wcId) {
            try { await ipcRenderer.invoke('force-light-color-scheme', wcId, false); } catch (_) {}
            // Reset background to themed content color
            webview.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--color-bg-content').trim() || '';
          }
        };
        
        // Add to DOM - insert before the new tab button
        this.tabsContainer.appendChild(tabElement);
        this.viewsContainer.appendChild(viewElement);
        
        // Update the new tab button position
        this.updateNewTabButtonPosition();
        
        // Set up event listeners
        tabElement.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); this.closeTab(tabId); } });
        tabElement.addEventListener('click', (e) => {
          if (!e.target.classList.contains('tab-close')) {
            this.activateTab(tabId);
          }
        });
        
        tabElement.querySelector('.tab-close').addEventListener('click', () => {
          this.closeTab(tabId);
        });
        
        // Set up webview events
        webview.addEventListener('page-title-updated', (e) => {
          const titleElement = tabElement.querySelector('.tab-title');
          titleElement.textContent = e.title;
          titleElement.title = e.title;
        });
        
        webview.addEventListener('did-start-loading', () => {
          tabElement.classList.add('loading');
        });
        
        webview.addEventListener('did-stop-loading', () => {
          tabElement.classList.remove('loading');
        });

        webview.addEventListener('dom-ready', () => {
          ensureWebviewBackground();
          applyAppleLightScheme();
        });

        webview.addEventListener('did-navigate', () => applyAppleLightScheme());
        webview.addEventListener('did-navigate-in-page', () => applyAppleLightScheme());
        
        const handleOpenUrl = (targetUrl) => {
          const url = targetUrl;
          const { isInAppUrl, isSafeExternalUrl } = require('./src/url-policy.js');
          // Explicitly treat auth/navigation endpoints as internal and navigate in same tab
          if (/^https?:\/\/grok\.com\/sign-in(\b|\/|\?|#)/i.test(url)
           || /^https?:\/\/grok\.com\/sign-out(\b|\/|\?|#)/i.test(url)
           || /^https?:\/\/accounts\.x\.ai\/sign-in(\b|\/|\?|#)/i.test(url)) {
            if (typeof webview.loadURL === 'function') {
              webview.loadURL(url);
            } else {
              webview.src = url;
            }
            return;
          }

          const isInternalUrl = isInAppUrl(url);

          if (isInternalUrl) {
            if (typeof webview.loadURL === 'function') {
              webview.loadURL(url);
            } else {
              webview.src = url;
            }
          } else if (isSafeExternalUrl(url)) {
            require('electron').shell.openExternal(url);
          }
        };

        // Open links that request a new window
        webview.addEventListener('new-window', (e) => { e.preventDefault(); handleOpenUrl(e.url); });
        // Allow internal same-tab nav; open external in browser
        webview.addEventListener('will-navigate', (e) => {
          const url = e.url;
          // Note: 'will-navigate' on <webview> is not cancelable; the main process
          // enforces this policy. Kept here only as a no-op hook for clarity.
          void url;
        });
        
        // Store tab info
        this.tabs.push({
          id: tabId,
          element: tabElement,
          view: viewElement,
          webview: webview
        });
        
        // Activate the new tab
        this.activateTab(tabId);
        
        return tabId;
      },

      // Embedded terminal tab running the Grok Build CLI (xterm.js + node-pty in main)
      async createTerminalTab(folder, opts = {}) {
        const { Terminal } = require('@xterm/xterm');
        const { FitAddon } = require('@xterm/addon-fit');
        const tabId = 'tab-' + Date.now();
        const tabElement = document.createElement('div');
        tabElement.className = 'tab';
        tabElement.id = tabId;
        tabElement.innerHTML = `<div class="tab-title"></div><button class="tab-close" title="Close tab (Ctrl+W, middle-click)">×</button>`;
        const titleEl = tabElement.querySelector('.tab-title');
        titleEl.textContent = opts.title || gdBase(folder);
        titleEl.title = folder;
        const viewElement = document.createElement('div');
        viewElement.className = 'view';
        viewElement.id = 'view-' + tabId;
        const host = document.createElement('div');
        host.className = 'terminal-host';
        viewElement.appendChild(host);
        this.tabsContainer.appendChild(tabElement);
        this.viewsContainer.appendChild(viewElement);
        this.updateNewTabButtonPosition();
        tabElement.addEventListener('auxclick', (e) => { if (e.button === 1) { e.preventDefault(); this.closeTab(tabId); } });
        tabElement.addEventListener('click', (e) => {
          if (!e.target.classList.contains('tab-close')) this.activateTab(tabId);
        });
        tabElement.querySelector('.tab-close').addEventListener('click', () => this.closeTab(tabId));

        const term = new Terminal({
          fontFamily: '"Cascadia Mono", "Cascadia Code", Consolas, monospace',
          fontSize: 13,
          cursorBlink: true,
          theme: { background: '#0c0c0c' }
        });
        const fit = new FitAddon();
        term.loadAddon(fit);
        term.open(host);
        const tab = { id: tabId, element: tabElement, view: viewElement, webview: null, term, fit, ptyId: null };
        this.tabs.push(tab);
        this.activateTab(tabId);
        await new Promise(r => requestAnimationFrame(r));
        try { fit.fit(); } catch (_) {}

        const res = await ipcRenderer.invoke('pty-spawn', { cwd: folder, cols: term.cols, rows: term.rows, sessionId: opts.sessionId || null });
        if (!res || res.error) {
          term.write(`\r\nCould not start grok: ${(res && res.error) || 'unknown error'}\r\n`);
          return tabId;
        }
        tab.ptyId = res.id;
        term.onData(d => ipcRenderer.send('pty-write', res.id, d));
        term.onResize(({ cols, rows }) => ipcRenderer.send('pty-resize', res.id, cols, rows));
        const ro = new ResizeObserver(() => {
          if (viewElement.classList.contains('active')) { try { fit.fit(); } catch (_) {} }
        });
        ro.observe(host);
        tab.onClose = () => {
          ro.disconnect();
          if (tab.ptyId) ipcRenderer.send('pty-kill', tab.ptyId);
          tab.ptyId = null;
          term.dispose();
        };
        term.focus();
        return tabId;
      },

      activateNextTab() {
        if (!this.tabs.length) return;
        if (!this.activeTabId) {
          this.activateTab(this.tabs[0].id);
          return;
        }
        const currentIndex = this.tabs.findIndex(t => t.id === this.activeTabId);
        const nextIndex = (currentIndex + 1) % this.tabs.length;
        this.activateTab(this.tabs[nextIndex].id);
      },

      activatePrevTab() {
        if (!this.tabs.length) return;
        if (!this.activeTabId) {
          this.activateTab(this.tabs[0].id);
          return;
        }
        const currentIndex = this.tabs.findIndex(t => t.id === this.activeTabId);
        const prevIndex = (currentIndex - 1 + this.tabs.length) % this.tabs.length;
        this.activateTab(this.tabs[prevIndex].id);
      },

      reloadActiveTab() {
        const activeTab = this.tabs.find(tab => tab.id === this.activeTabId);
        if (!activeTab || !activeTab.webview) return;
        const reloadButton = document.getElementById('reload-button');
        if (reloadButton) {
          reloadButton.classList.add('loading');
          const removeLoading = () => {
            reloadButton.classList.remove('loading');
            activeTab.webview.removeEventListener('did-stop-loading', removeLoading);
          };
          activeTab.webview.addEventListener('did-stop-loading', removeLoading);
        }
        activeTab.webview.reload();
      },

      setupScrollButtons() {
        this.leftBtn = document.getElementById('tabs-scroll-left');
        this.rightBtn = document.getElementById('tabs-scroll-right');
        this.scrollContainer = this.tabsContainer; // tabs container is the scroll target for x
        if (this.leftBtn && this.rightBtn) {
          this.leftBtn.addEventListener('click', () => this.scrollByAmount(-200));
          this.rightBtn.addEventListener('click', () => this.scrollByAmount(200));
          // Update on scroll and resize
          this.scrollContainer.addEventListener('scroll', () => this.updateScrollButtons(), { passive: true });
          window.addEventListener('resize', () => this.updateScrollButtons());

          // Add mouse wheel functionality when hovering over tabs
          this.scrollContainer.addEventListener('wheel', (e) => {
            // Only handle if we're over the tabs area (not scroll buttons)
            if (e.target.closest('.tabs-scroll')) return;

            // Check if Ctrl is pressed for tab switching
            if (e.ctrlKey) {
              // Ctrl + scroll = switch tabs
              e.preventDefault(); // Prevent any default behavior
              if (e.deltaY > 0) {
                // Scroll down = next tab
                this.activateNextTab();
              } else if (e.deltaY < 0) {
                // Scroll up = previous tab
                this.activatePrevTab();
              }
            } else {
              // Regular scroll = horizontal scrolling of tabs
              const deltaX = e.deltaY * 0.5; // Scale down for smoother scrolling
              this.scrollContainer.scrollBy({
                left: deltaX,
                behavior: 'auto' // Use 'auto' for immediate response to wheel
              });

              // Prevent default vertical scrolling when over tabs
              e.preventDefault();
            }
          }, { passive: false });

          // Initial
          this.updateScrollButtons();
        }
      },

      scrollByAmount(dx) {
        this.scrollContainer.scrollBy({ left: dx, behavior: 'smooth' });
      },

      updateScrollButtons() {
        if (!this.leftBtn || !this.rightBtn) return;
        const sc = this.scrollContainer;
        const canScrollLeft = sc.scrollLeft > 0;
        const canScrollRight = Math.ceil(sc.scrollLeft + sc.clientWidth) < sc.scrollWidth;
        // Arrows only when the strip overflows; disabled at either end
        const overflow = sc.scrollWidth > sc.clientWidth + 1;
        this.leftBtn.style.display = overflow ? 'inline-flex' : 'none';
        this.rightBtn.style.display = overflow ? 'inline-flex' : 'none';
        this.leftBtn.disabled = !canScrollLeft;
        this.rightBtn.disabled = !canScrollRight;
      },
      
      activateTab(tabId) {
        // Deactivate current active tab
        if (this.activeTabId) {
          const activeTab = this.tabs.find(tab => tab.id === this.activeTabId);
          if (activeTab) {
            activeTab.element.classList.remove('active');
            activeTab.view.classList.remove('active');
          }
        }
        
        // Activate new tab
        const tab = this.tabs.find(tab => tab.id === tabId);
        if (tab) {
          tab.element.classList.add('active');
          tab.view.classList.add('active');
          this.activeTabId = tabId;
          if (tab.term) {
            requestAnimationFrame(() => { try { tab.fit.fit(); } catch (_) {} tab.term.focus(); });
          }
          // Bring the active tab fully into view in the scrolling strip
          requestAnimationFrame(() => {
            try { tab.element.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' }); } catch (_) {}
            setTimeout(() => this.updateScrollButtons(), 350);
          });
        }
      },
      
      closeTab(tabId) {
        const tabIndex = this.tabs.findIndex(tab => tab.id === tabId);
        
        if (tabIndex !== -1) {
          const tab = this.tabs[tabIndex];
          if (typeof tab.onClose === 'function') { try { tab.onClose(); } catch (_) {} }
          
          // Remove from DOM
          tab.element.remove();
          tab.view.remove();
          
          // Remove from tabs array
          this.tabs.splice(tabIndex, 1);
          
          // If this was the active tab, activate another one
          if (this.activeTabId === tabId) {
            if (this.tabs.length > 0) {
              // Activate the tab to the left, or the first tab if this was the leftmost
              const newActiveIndex = Math.max(0, tabIndex - 1);
              this.activateTab(this.tabs[newActiveIndex].id);
            } else {
              this.activeTabId = null;
            }
          }
          
          // If no tabs left, create a new one
          if (this.tabs.length === 0) {
            this.createTab('https://grok.com');
          } else {
            // Update the new tab button position
            this.updateNewTabButtonPosition();
          }
        }
      }
    };
    
    // Global shortcut handlers from main process
    ipcRenderer.on('shortcut-new-tab', () => {
      tabManager.createTab('https://grok.com');
    });
    ipcRenderer.on('shortcut-next-tab', () => {
      tabManager.activateNextTab();
    });
    ipcRenderer.on('shortcut-prev-tab', () => {
      tabManager.activatePrevTab();
    });
    ipcRenderer.on('shortcut-reload-tab', () => {
      tabManager.reloadActiveTab();
    });
    ipcRenderer.on('shortcut-show-info', () => {
      if (window.ipcRenderer) {
        window.ipcRenderer.invoke('show-app-info');
      } else if (typeof ipcRenderer !== 'undefined') {
        ipcRenderer.invoke('show-app-info');
      }
    });
    // In-app links that requested a new window (target=_blank / window.open)
    ipcRenderer.on('open-url-in-new-tab', (_event, url) => {
      tabManager.createTab(url);
    });
    // Embedded terminal I/O
    ipcRenderer.on('pty-data', (_event, id, data) => {
      const tab = tabManager.tabs.find(t => t.ptyId === id);
      if (tab && tab.term) tab.term.write(data);
    });
    ipcRenderer.on('pty-exit', (_event, id, code) => {
      const tab = tabManager.tabs.find(t => t.ptyId === id);
      if (tab && tab.term) {
        tab.ptyId = null;
        tab.term.write(`\r\n\x1b[90m[grok exited with code ${code}]\x1b[0m\r\n`);
      }
    });
    // Flyout shortcuts (Ctrl+Shift+1..9,0 bots; Ctrl+Shift+F1..F10 folders; Ctrl+Shift+N)
    ipcRenderer.on('shortcut-close-tab', () => { if (tabManager.activeTabId) tabManager.closeTab(tabManager.activeTabId); });
    ipcRenderer.on('flyout-run', (_event, method, ...args) => {
      if (method === 'createTab' && typeof args[0] === 'string') tabManager.createTab(args[0]);
      else if (method === 'createTerminalTab' && typeof args[0] === 'string') tabManager.createTerminalTab(args[0], args[1] || {});
    });
    ipcRenderer.on('shortcut-bot-index', (_event, n) => newTabFlyout.runIndex('bot', n));
    ipcRenderer.on('shortcut-build-index', (_event, n) => newTabFlyout.runIndex('folder', n));
    ipcRenderer.on('shortcut-build-new', () => newTabFlyout.newBuild());
    ipcRenderer.on('open-about-tab', (event, aboutUrl) => {
      tabManager.createTab(aboutUrl);
    });

    // Usage bar: weekly combined usage pool (same meter as grok.com Settings > Usage)
    // Feature inspired by Joshua Wang's Grok Usage Watch extension
    // https://github.com/JoshuaWang2211 - Thanks for your contribution!
    const CREDITS_URL = 'https://grok.com/?_s=billing';
    const usageStats = {
      isActive: false,
      hidden: false,
      relative: false,
      resetEnd: null,
      refreshInterval: null,
      statusBar: null,
      button: null,

      init() {
        this.statusBar = document.getElementById('usage-status-bar');
        this.button = document.getElementById('usage-btn');
        try {
          this.isActive = localStorage.getItem('grokDesktopUsageBarActive') === 'true';
          this.hidden = localStorage.getItem('grokDesktopUsageHidden') === 'true';
          this.relative = localStorage.getItem('usageResetRelative') === '1';
        } catch (e) {}

        if (this.button) this.button.addEventListener('click', () => this.toggle());
        document.getElementById('usage-eye').addEventListener('click', () => {
          this.hidden = !this.hidden;
          try { localStorage.setItem('grokDesktopUsageHidden', this.hidden); } catch (e) {}
          this.applyHidden();
        });
        document.getElementById('usage-reset-wrap').addEventListener('click', () => {
          this.relative = !this.relative;
          try { localStorage.setItem('usageResetRelative', this.relative ? '1' : '0'); } catch (e) {}
          this.renderReset();
        });
        document.getElementById('usage-credits-wrap').addEventListener('click', () => {
          tabManager.createTab(CREDITS_URL);
        });
        setInterval(() => { if (this.relative) this.renderReset(); }, 30000);

        this.applyHidden();
        this.setActive(this.isActive);
      },

      applyHidden() {
        const eye = document.getElementById('usage-eye');
        this.statusBar.classList.toggle('usage-hidden', this.hidden);
        eye.classList.toggle('hidden', this.hidden);
        eye.title = this.hidden ? 'Show usage' : 'Hide usage';
      },

      toggle() {
        this.isActive = !this.isActive;
        try { localStorage.setItem('grokDesktopUsageBarActive', this.isActive); } catch (e) {}
        this.setActive(this.isActive);
      },

      setActive(on) {
        if (this.button) this.button.classList.toggle('active', on);
        this.statusBar.classList.toggle('active', on);
        document.body.classList.toggle('usage-bar-active', on);
        if (this.refreshInterval) { clearInterval(this.refreshInterval); this.refreshInterval = null; }
        if (on) {
          this.fetchStats();
          this.refreshInterval = setInterval(() => this.fetchStats(), 60000);
        }
      },

      async fetchStats() {
        let data;
        try {
          data = await ipcRenderer.invoke('fetch-grok-usage');
        } catch (e) {
          data = { weekly: { error: e.message } };
        }
        this.updateDisplay(data && data.weekly);
      },

      renderReset() {
        const wrap = document.getElementById('usage-reset-wrap');
        const el = document.getElementById('usage-reset');
        if (!this.resetEnd || isNaN(this.resetEnd)) { wrap.style.display = 'none'; return; }
        wrap.style.display = '';
        if (this.relative) {
          const ms = Math.max(0, this.resetEnd - Date.now());
          const d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60;
          el.textContent = `${d ? d + 'd ' : ''}${h}:${String(m).padStart(2, '0')}`;
        } else {
          el.textContent = this.resetEnd.toLocaleString(undefined,
            { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        }
      },

      updateDisplay(w) {
        const wrap = document.getElementById('usage-weekly-wrap');
        const el = document.getElementById('usage-weekly');
        const creditsWrap = document.getElementById('usage-credits-wrap');
        el.classList.remove('warning', 'critical');

        if (!w || typeof w.usagePercent !== 'number') {
          el.textContent = '—';
          wrap.title = 'Weekly usage unavailable' + (w && w.error ? `: ${w.error}` : '');
          creditsWrap.style.display = 'none';
          this.resetEnd = null;
          this.renderReset();
          return;
        }

        const pct = Math.round(w.usagePercent * 10) / 10;
        el.textContent = `${pct}%`;
        if (pct >= 90) el.classList.add('critical'); else if (pct >= 70) el.classList.add('warning');

        // Tooltip: pace (average burn since reset vs. what is left per remaining day)
        const lines = [];
        const startMs = Date.parse(w.periodStart), endMs = Date.parse(w.periodEnd);
        if (!isNaN(startMs) && !isNaN(endMs) && endMs > startMs) {
          const DAY = 86400000, now = Date.now();
          const elapsed = Math.max(0.1, (now - startMs) / DAY);
          const left = Math.max(0.1, (endMs - now) / DAY);
          // 14.2% per day is the goal.
          const avg = w.usagePercent / elapsed;
          lines.push(`Avg since reset: ${avg.toFixed(1)}%/day`);
          lines.push(`Left per day: ${(Math.max(0, 100 - w.usagePercent) / left).toFixed(1)}%/day`);
          lines.push(`On pace for ${(avg * ((endMs - startMs) / DAY)).toFixed(1)}% by reset`);
          if ((w.products || []).length) lines.push('');
        }
        lines.push(...(w.products || []).map(p => `${p.product}: ${p.usagePercent}%`));
        wrap.title = lines.join('\n');

        // Credits (prepaid balance, cents)
        const usd = (c) => '$' + (c / 100).toFixed(2);
        if (typeof w.prepaidCents === 'number') {
          let text = usd(w.prepaidCents);
          if (typeof w.onDemandUsedCents === 'number' && typeof w.onDemandCapCents === 'number' && w.onDemandCapCents > 0) {
            text += ` (extra ${usd(w.onDemandUsedCents)}/${usd(w.onDemandCapCents)})`;
          }
          document.getElementById('usage-credits').textContent = text;
          creditsWrap.style.display = '';
        } else {
          creditsWrap.style.display = 'none';
        }

        this.resetEnd = w.periodEnd ? new Date(w.periodEnd) : null;
        this.renderReset();
      }
    };

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      tabManager.init();
      usageStats.init();
      // Click to open latest release page
      const indicator = document.getElementById('update-indicator');
      if (indicator) {
        indicator.addEventListener('click', () => {
          const url = latestReleaseUrl || 'https://github.com/AnRkey/Grok-Desktop/releases/latest';
          if (window.ipcRenderer) {
            window.ipcRenderer.invoke('open-external-url', url);
          } else if (typeof ipcRenderer !== 'undefined') {
            ipcRenderer.invoke('open-external-url', url);
          }
        });
      }
      const updateBtn = document.getElementById('update-btn');
      if (updateBtn) {
        updateBtn.addEventListener('click', () => {
          const url = latestReleaseUrl || 'https://github.com/AnRkey/Grok-Desktop/releases/latest';
          if (window.ipcRenderer) {
            window.ipcRenderer.invoke('open-external-url', url);
          } else if (typeof ipcRenderer !== 'undefined') {
            ipcRenderer.invoke('open-external-url', url);
          }
        });
      }
      const infoBtn = document.getElementById('info-btn');
      if (infoBtn) {
        infoBtn.addEventListener('click', () => {
          if (window.ipcRenderer) {
            window.ipcRenderer.invoke('show-app-info');
          } else if (typeof ipcRenderer !== 'undefined') {
            ipcRenderer.invoke('show-app-info');
          }
        });
      }
    });
  </script>
</body>
